_schema-version: 3.3.0
ID: fs2-bp-ext-app
version: 1.0.0
description: "BP Change & Extend — RAP-redesign as a pure BTP CAP app (governance/request layer over the S/4 released Business Partner API)."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        # Ship the dedicated-schema bootstrap into the Postgres deployer image
        - cp deploy/setup-schema.js gen/pg/setup-schema.js
        # Bundle the Fiori webapp into the approuter so it can be served via localDir
        - mkdir -p app/router/bp
        - cp -r app/bp/webapp app/router/bp/
modules:
  - name: fs2-bp-ext-app-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    # Isolate all BP objects in a dedicated Postgres schema (no impact on the
    # other apps sharing this instance, which live in `public`). The schema is
    # baked into the CAP config (package.json cds.requires.db.credentials.schema)
    # so every connection issues `SET search_path TO znus_bp`.
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: fs2-bp-ext-app-auth
      - name: fs2-bp-ext-app-destination
      - name: fs2-bp-ext-app-postgres

  - name: fs2-bp-ext-app
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: fs2-bp-ext-app-auth
      - name: fs2-bp-ext-app-destination
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: fs2-bp-ext-app-postgres-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-to-postgresql
          # Create the dedicated schema, then deploy BP tables into it. The
          # schema env is set inline so cds-deploy's introspection is scoped to
          # znus_bp (never the shared `public` where other apps' tables live).
          command: CDS_REQUIRES_DB_CREDENTIALS_SCHEMA=znus_bp node setup-schema.js && CDS_REQUIRES_DB_CREDENTIALS_SCHEMA=znus_bp npm start
    requires:
      - name: fs2-bp-ext-app-postgres

resources:
  - name: fs2-bp-ext-app-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: fs2-bp-ext-app-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: fs2-bp-ext-app-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  # Reuse the existing shared Postgres instance (free-plan quota is already used
  # by it); the BP app stays isolated via the dedicated `znus_bp` schema.
  - name: fs2-bp-ext-app-postgres
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: zepcappg-postgres
